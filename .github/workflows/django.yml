name: Django Workflow

on:
  push:
    branches:
      - django
  workflow_dispatch:
    inputs:
      is_active:
        default: true
        type: boolean

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Nodejs
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Check nodejs version
        run: |
          node --version
          which node

      - name: Install UV
        uses: astral-sh/setup-uv@v10.0.1

      - name: Check UV version
        run: |
          uv --version
          which uv

      - name: Prints
        run: |
          echo "Print details"
          echo "${{toJson(github)}}"
