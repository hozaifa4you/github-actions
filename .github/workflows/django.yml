name: Django Workflow

on:
  push:
    branches:
      - django
  workflow_dispatch:
    inputs:
      is_active:
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13

      - name: Install Nodejs
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install UV
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.13

      - name: Check deployable
        run: |
          uv run manage.py check

      - name: Install dependencies
        run: |
          uv sync
          npm ci

      - name: Run migrations
        run: |
          uv run manage.py migrate

      - name: Check for migrations
        run: |
          uv run manage.py makemigrations --check --dry-run
          uv run manage.py showmigrations
          ls db.sqlite3

      - name: Run Django tests
        run: |
          uv run manage.py test

      - name: Build CSS
        run: npm run build

      - name: Collect static files
        run: uv run manage.py collectstatic --noinput

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: django-app
          path: |
            manage.py
            deploy.sh
            pyproject.toml
            uv.lock
            .python-version
            apps/
            config/
            infra/
            staticfiles/
            !**/__pycache__
            !**/tests.py
            !**/.env*
          include-hidden-files: true
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: django-app
          path: django-app

      - name: Clean APP_DIR variable
        env:
          APP_DIR: ${{vars.APP_DIR}}
        run: echo "APP_DIR=$(printf '%s' "$APP_DIR" | tr -d '[:cntrl:]')" >> "$GITHUB_ENV"

      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{vars.VPS_HOST}}
          username: ${{vars.VPS_USERNAME}}
          password: ${{secrets.VPS_PASS}}
          source: django-app
          target: ${{env.APP_DIR}}
          strip_components: 1

      - name: Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{vars.VPS_HOST}}
          username: ${{vars.VPS_USERNAME}}
          password: ${{secrets.VPS_PASS}}
          script: |
            cd "${{env.APP_DIR}}"
            bash deploy.sh
