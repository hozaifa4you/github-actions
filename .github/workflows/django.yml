name: Django Workflow

on:
  push:
    branches:
      - django
  workflow_dispatch:
    inputs:
      is_active:
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: ls -R

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Check UV version
        run: |
          uv --version
          which uv
